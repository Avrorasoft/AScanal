name: tva
description: Aplicación oficial de CANAL 9 TVA - TELEVISIÓN AMAZÓNICA - RIBERALTA.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # --- MOTOR DE REPRODUCCIÓN ---
  video_player: ^2.8.6
  
  # --- MOTOR DE RED Y TRANSMISIÓN ---
  http: ^1.2.1
  multicast_dns: ^0.3.2+4
  
  # --- MOTOR DE GEOFENCING Y SEGURIDAD TERRITORIAL ---
  geolocator: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # DECLARACIÓN DE ARCHIVOS DE CONTROL MAESTRO
  assets:
    - assets/config_tva.json